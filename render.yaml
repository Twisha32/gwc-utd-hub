# Render blueprint: New > Blueprint, point it at this repo.
# See docs/deploy.md for the two env vars you fill in by hand after the first deploy.
databases:
  - name: gwc-hub-db
    plan: free

services:
  - type: web
    name: gwc-hub-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gwc-hub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FLAG_PEPPER
        generateValue: true
      - key: ALLOWED_EMAIL_DOMAINS
        value: utdallas.edu
      # load balancer, then the web service, then us: two hops before the real client
      - key: TRUST_PROXY
        value: "2"
      - key: OFFICER_EMAILS
        sync: false
      - key: CLUB_JOIN_CODE
        sync: false
      # public URL of the web service below, e.g. https://gwc-hub-web.onrender.com
      - key: WEB_ORIGIN
        sync: false

  - type: web
    name: gwc-hub-web
    runtime: docker
    dockerfilePath: ./web/Dockerfile
    dockerContext: ./web
    plan: free
    envVars:
      # public URL of the api service above
      - key: API_URL
        sync: false
