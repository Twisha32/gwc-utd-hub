name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gwc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/gwc_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  # builds both images and checks the stack really comes up and talks to itself
  smoke:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: wait for the web app to reach the api and database
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:3000/api/health; then echo; exit 0; fi
            sleep 3
          done
          docker compose logs
          exit 1
      - name: sign up through the web app and read the session back
        run: |
          curl -fsS -c jar -H 'content-type: application/json' \
            -d '{"name":"CI Check","email":"ci@example.com","password":"password123"}' \
            http://localhost:3000/api/auth/register
          curl -fsS -b jar http://localhost:3000/api/auth/me | grep -q ci@example.com
      - if: always()
        run: docker compose down -v
